<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="lock-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="form-title">Iniciar sesión</h1>
      <p class="form-subtitle">Ingresá a tu cuenta de TecnoCommerce para gestionar tus compras.</p>
    </div>

    @if (isError()) {
      <div class="alert-error">
        {{mensajeError() || 'Email o contraseña incorrectos. Verificá las credenciales e intentá nuevamente.'}}
      </div>
    }

    <form class="login-form" (ngSubmit)="handleLoginSubmit()">
      <div class="form-group">
        <label for="userEmail">Email <span class="required">*</span></label>
        <div class="input-wrapper">
          <input
            id="userEmail"
            name="email"
            type="email"
            [(ngModel)]="email"
            (ngModelChange)="clearError()"
            required
            placeholder="tunombre@correo.com"
          />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="userPassword">Contraseña <span class="required">*</span></label>
          <a class="link-muted" href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="input-wrapper">
          <input
            id="userPassword"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            (ngModelChange)="clearError()"
            required
            placeholder="••••••••"
          />
          <button
            type="button"
            class="btn-toggle-eye"
            (click)="togglePasswordVisibility()"
            aria-label="Mostrar u ocultar contraseña"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="remember-row">
        <input id="rememberMe" name="remember" type="checkbox" />
        <label for="rememberMe">Recordarme en este equipo</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
          @if (isSubmitting() && !isSuccess()) {
            Verificando...
          } @else if (isSuccess()) {
            ¡Bienvenido!
          } @else {
            Ingresar
          }
        </button>
      </div>
    </form>

    <p class="auth-switch">
      ¿No tenés cuenta? <a routerLink="/registro">Registrate</a>
    </p>
  </div>
</div>
