name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela corridas viejas de la misma rama cuando llega un commit nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Angular (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests de Angular
        run: npx ng test --watch=false
      - name: Build de producción
        run: npx ng build

  backend:
    name: Backend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chequeo de tipos del backend
        run: npm run typecheck:back
      # Cuando el backend tenga tests, agregar acá `npm run test:back`.
