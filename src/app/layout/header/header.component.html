<header class="navbar">
  <!-- Sección Izquierda: Logo, Hamburguesa y Enlaces -->
  <div class="nav-left">
    
    <!-- Botón Menú Hamburguesa (Solo visible en Mobile) -->
    <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        @if (!menuAbierto) {
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        } @else {
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        }
      </svg>
    </button>

    <!-- Marca / Logo -->
    <a routerLink="/" class="brand" (click)="cerrarMenu()">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2" />
          <rect x="9" y="9" width="6" height="6" />
          <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3" />
        </svg>
      </div>
      <span class="brand-name">TecnoCommerce</span>
    </a>

    <!-- Enlaces de navegación (Desktop y desplegable Mobile) -->
    <nav class="nav-links" [class.show]="menuAbierto">
      <a routerLink="/productos" routerLinkActive="active" class="nav-link" (click)="cerrarMenu()">Productos</a>
      @if (auth.esAdmin()) {
        <a routerLink="/admin/productos" routerLinkActive="active" class="nav-link" (click)="cerrarMenu()">Inventario</a>
        <a routerLink="/admin/productos/nuevo" routerLinkActive="active" class="nav-link" (click)="cerrarMenu()">Nuevo Producto</a>
      }
      
      <!-- Opciones de cuenta integradas en el menú mobile si no está logueado -->
      <div class="mobile-auth-section">
        @if (!auth.usuarioActual()) {
          <a routerLink="/login" class="nav-link" (click)="cerrarMenu()">Iniciar sesión</a>
          <a routerLink="/registro" class="btn-register" (click)="cerrarMenu()">Registrarse</a>
        }
      </div>
    </nav>
  </div>

  <!-- Sección Derecha: Carrito y Perfil -->
  <div class="nav-right">
    <!-- Carrito -->
    <button routerLink="/carrito" class="cart-btn" aria-label="Carrito de compras" (click)="cerrarMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="21" r="1" />
        <circle cx="19" cy="21" r="1" />
        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
      </svg>
      @if (pedidoService.cantidadCarrito() > 0) {
        <span class="cart-badge">{{ pedidoService.cantidadCarrito() }}</span>
      }
    </button>

    @if (auth.usuarioActual(); as usuario) {
      <div class="user-profile desktop-only" routerLink="/perfil">
        <div class="user-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
        <div class="user-info">
          <span class="user-name">{{ usuario.nombre }}</span>
          <span class="user-sub">Mi Cuenta</span>
        </div>
      </div>
      <!-- Cerrar sesión: icono de apagado (power) -->
      <button
        type="button"
        class="btn-logout"
        (click)="cerrarSesion()"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
          <line x1="12" y1="2" x2="12" y2="12" />
        </svg>
      </button>
    } @else {
      <div class="desktop-auth">
        <a routerLink="/login" class="nav-link">Iniciar sesión</a>
        <a routerLink="/registro" class="btn-register">Registrarse</a>
      </div>
    }
  </div>
</header>
