<article class="card">
  <!-- Toast flotante de notificación (éxito o error de stock) -->
  @if (mensajeAlerta) {
    <div class="toast-card" [class.success]="tipoAlerta === 'success'" [class.danger]="tipoAlerta === 'danger'">
      {{ mensajeAlerta }}
    </div>
  }

  <a class="card-image-box" [routerLink]="['/productos', product.id]" tabindex="-1">
    <span class="category-badge">{{ product.category }}</span>
    <img [src]="product.imageUrl" [alt]="product.title" class="product-img" />
  </a>

  <div class="card-content">
    <h3 class="product-title" [title]="product.title">
      <a class="product-title-link" [routerLink]="['/productos', product.id]">{{ product.title }}</a>
    </h3>
    <p class="product-description">{{ product.description }}</p>

    <!-- Indicador de Stock -->
    <div class="stock-indicator" [class.out-of-stock]="!hayStock()">
      @if (hayStock()) {
        <span>Stock disponible: <strong>{{ stockActual() }}</strong></span>
      } @else {
        <span class="no-stock-text">Sin stock</span>
      }
    </div>

    <div class="card-footer">
      <div class="price-box">
        <span class="price-label">Precio contado</span>
        <strong class="price-value">$ {{ product.price | number:'1.0-0' }} ARS</strong>
      </div>

      <div class="card-actions">
        <!-- Botón Ver Detalle -->
        <a class="btn-detail" [routerLink]="['/productos', product.id]" aria-label="Ver detalle del producto" title="Ver detalle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-icon">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </a>

        <!-- Botón Agregar al Carrito Rápido -->
        <button 
          class="btn-add-cart" 
          [disabled]="!hayStock()"
          [class.disabled]="!hayStock()"
          (click)="agregarAlCarrito()"
          title="Agregar al carrito">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
</article>
