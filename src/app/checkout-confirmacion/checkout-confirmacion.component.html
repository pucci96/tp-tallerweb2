<section class="checkout-page">
  <app-checkout-cabecera
    [paso]="1"
    icono="envio"
    titulo="Datos de envío"
    subtitulo="Revisá tu pedido y completá a dónde lo enviamos."
    etiquetaPaso="Envío"
  />

  @if (cargando()) {
    <p class="loading-state">Cargando tu pedido...</p>
  } @else if (carrito(); as c) {
    <div class="checkout-grid">
      <form id="form-envio" class="panel" [formGroup]="form" (ngSubmit)="continuar()" novalidate>
        <div class="panel-head"><h2>Dirección de entrega</h2></div>
        <div class="panel-body">
          <div class="field-row">
            <label class="field">
              <span>Nombre</span>
              <input type="text" formControlName="nombre" autocomplete="given-name" />
              @if (campoInvalido('nombre')) {
                <small class="field-error">Ingresá tu nombre.</small>
              }
            </label>
            <label class="field">
              <span>Apellido</span>
              <input type="text" formControlName="apellido" autocomplete="family-name" />
              @if (campoInvalido('apellido')) {
                <small class="field-error">Ingresá tu apellido.</small>
              }
            </label>
          </div>
          <label class="field">
            <span>Email</span>
            <input type="email" formControlName="email" autocomplete="email" />
            @if (campoInvalido('email')) {
              <small class="field-error">Ingresá un email válido.</small>
            }
          </label>
          <label class="field">
            <span>Dirección</span>
            <input type="text" formControlName="direccion" autocomplete="street-address" />
            @if (campoInvalido('direccion')) {
              <small class="field-error">Ingresá tu dirección.</small>
            }
          </label>
          <div class="field-row">
            <label class="field">
              <span>Ciudad</span>
              <input type="text" formControlName="ciudad" autocomplete="address-level2" />
              @if (campoInvalido('ciudad')) {
                <small class="field-error">Ingresá tu ciudad.</small>
              }
            </label>
            <label class="field">
              <span>Código postal</span>
              <input type="text" formControlName="codigoPostal" autocomplete="postal-code" maxlength="8" />
              @if (campoInvalido('codigoPostal')) {
                <small class="field-error">Entre 4 y 8 letras o números.</small>
              }
            </label>
          </div>
        </div>
      </form>

      <app-checkout-resumen [resumen]="c" modificarRuta="/carrito" modificarTexto="Modificar el carrito">
        <button
          type="submit"
          form="form-envio"
          class="btn-primary btn-block"
          data-test="continuar"
          [disabled]="form.invalid"
        >
          Continuar al pago
        </button>
      </app-checkout-resumen>
    </div>
  } @else {
    <div class="panel empty-state">
      <p class="empty-title">Tu carrito está vacío</p>
      <p class="empty-text">Agregá productos para continuar con la compra.</p>
      <a routerLink="/productos" class="btn-primary">Ver productos</a>
    </div>
  }
</section>
